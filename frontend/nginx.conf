server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Try to serve the requested file
        # If not found, fall back to index.html (for React Router)
        try_files $uri /index.html;
    }

    # Optional: caching rules for static files
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle 404 by serving index.html
    error_page 404 /index.html;
}
